# /etc/nginx/sites-available/pilepoil
# Remplace api.pilepoil.fr par ton sous-domaine, puis : certbot --nginx -d api.pilepoil.fr

# Limite de débit côté Nginx (en plus de celle du moteur).
limit_req_zone $binary_remote_addr zone=pilepoil:10m rate=5r/s;

# Journaux sans adresse IP complète (RGPD) : on masque le dernier octet.
map $remote_addr $pilepoil_ip_anon {
    ~(?P<ip>\d+\.\d+\.\d+)\.\d+   $ip.0;
    ~(?P<ip>[^:]+:[^:]+):         $ip::;
    default                        0.0.0.0;
}
log_format pilepoil_anon '$pilepoil_ip_anon [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name api.pilepoil.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.pilepoil.fr;

    # Certificats posés par certbot
    ssl_certificate     /etc/letsencrypt/live/api.pilepoil.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pilepoil.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/pilepoil.access.log pilepoil_anon;
    server_tokens off;
    client_max_body_size 1k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        limit_req zone=pilepoil burst=20 nodelay;
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 25s;
    }
}
